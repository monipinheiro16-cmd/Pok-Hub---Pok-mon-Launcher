name: Build PokeHub Fire TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: unzip -o PokeHubFireTV-CORRIGIDO.zip

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        working-directory: PokeHubFireTV-CORRIGIDO
        run: gradle --no-daemon assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeHubFireTV-APK
          path: PokeHubFireTV-CORRIGIDO/app/build/outputs/apk/debug/app-debug.apk

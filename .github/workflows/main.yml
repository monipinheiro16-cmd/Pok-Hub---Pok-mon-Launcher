name: Build PokeHub Fire TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Extrair projeto do ZIP
        run: unzip -oq PokeHubFireTV.zip -d projeto

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma e build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK
        working-directory: projeto
        run: gradle --no-daemon assembleDebug

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeHubFireTV-debug-apk
          path: projeto/app/build/outputs/apk/debug/app-debug.apk
